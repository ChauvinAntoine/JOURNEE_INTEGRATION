<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOURNEE D'INTEGRATION</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>JOURNEE D'INTEGRATION</h1>
  </header>

  <!-- ==================== PAGE DE CONNEXION ==================== -->
  <section id="view-login" class="view">
    <div class="card login-card">
      <h2>Connexion équipe</h2>
      <p class="subtitle">Entrez le nom de votre équipe et le mot de passe pour commencer l'aventure.</p>
      <form id="login-form">
        <label for="team-name">Nom d'équipe</label>
        <input id="team-name" type="text" autocomplete="off" placeholder="Ex. : Les Panthères" required />
        <label for="team-pass">Mot de passe</label>
        <input id="team-pass" type="password" placeholder="Mot de passe" required />
        <button type="submit" class="btn primary">Commencer</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>
  </section>

  <!-- ==================== PAGE DE JEU (CHATBOT) ==================== -->
  <section id="view-game" class="view" hidden>
    <div class="game-header">
      <div class="game-header-info">
        <h2 id="team-label"></h2>
      </div>
    </div>

    <div class="chat-container card">
      <div id="chat-messages" class="chat-messages"></div>
      <div class="quick-replies">
        <button type="button" class="quick-btn" data-msg="J'y suis">J'y suis</button>
        <button id="words-toggle" class="words-toggle" type="button" hidden>Afficher les indices</button>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Écrivez votre réponse…" autocomplete="off" />
        <button type="submit" class="btn primary">Envoyer</button>
      </form>
    </div>
  </section>

  <!-- ==================== SÉLECTEUR DE VERSION + AIDE ==================== -->
  <div class="version-switch">
    <button id="version-desktop" class="version-btn" type="button">Version ordinateur</button>
    <button id="version-mobile" class="version-btn" type="button">Version téléphone</button>
  </div>

  <!-- ==================== INFO-BULLE AIDE ==================== -->
  <span id="hint-bubble" class="hint-bubble" hidden>
    <button id="hint-btn" class="hint-btn icon-btn" type="button" title="A l'aide" aria-label="A l'aide">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.4-3 4"></path>
        <line x1="12" y1="17.5" x2="12" y2="17.5"></line>
      </svg>
    </button>
    <div id="hint-tooltip" class="hint-tooltip" hidden>
      Venez voir les game masters pour obtenir un indice.
    </div>
  </span>

  <!-- ==================== DÉCONNEXION ==================== -->
  <div id="logout-area" class="logout-area" hidden>
    <button id="logout-btn" class="hint-btn logout-btn icon-btn" type="button" title="Déconnexion" aria-label="Déconnexion">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
